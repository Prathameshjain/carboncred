# =========================================
# CarbonCred - Docker Compose (Production)
# =========================================
# Services: db, pgadmin, backend, ml-service, frontend
# Run: docker compose up --build -d
# pgAdmin: http://localhost:5050  (nesar / nesar)
# App:     http://localhost
# API:     http://localhost/api/  or http://localhost:8000/api/

version: '3.9'

services:

  # =========================================
  # PostgreSQL Database
  # =========================================
  db:
    image: postgres:16-alpine
    container_name: carboncred-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Postgre123}
      POSTGRES_DB:       ${POSTGRES_DB:-carboncred}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - carboncred-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-carboncred}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # pgAdmin — Database Management GUI
  # =========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: carboncred-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    nesar@carboncred.com
      PGADMIN_DEFAULT_PASSWORD: nesar
      PGADMIN_LISTEN_PORT:      80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - carboncred-network
    depends_on:
      db:
        condition: service_healthy

  # =========================================
  # ML Verification Service (TensorFlow)
  # =========================================
  ml-service:
    build:
      context: ./ml-verification
      dockerfile: Dockerfile
    container_name: carboncred-ml
    restart: unless-stopped
    environment:
      ML_PORT: 5001
    networks:
      - carboncred-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # =========================================
  # Django Backend (Gunicorn)
  # =========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: carboncred-backend
    restart: unless-stopped
    environment:
      # Database
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Postgre123}
      POSTGRES_DB:       ${POSTGRES_DB:-carboncred}
      POSTGRES_HOST:     db
      POSTGRES_PORT:     5432
      # Django
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-me-in-production}
      DJANGO_DEBUG:      ${DJANGO_DEBUG:-False}
      # Blockchain
      ALCHEMY_URL:              ${ALCHEMY_URL:-}
      BLOCKCHAIN_PRIVATE_KEY:   ${BLOCKCHAIN_PRIVATE_KEY:-}
      CONTRACT_ADDRESS:         ${CONTRACT_ADDRESS:-}
      BLOCKCHAIN_CHAIN_ID:      ${BLOCKCHAIN_CHAIN_ID:-11155111}
      # ML Service
      ML_SERVICE_URL: http://ml-service:5001
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - carboncred-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/accounts/health/", "||", "curl", "-f", "http://localhost:8000/admin/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # =========================================
  # React Frontend (Nginx)
  # =========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carboncred-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - carboncred-network

# =========================================
# Persistent Volumes
# =========================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local

# =========================================
# Network Configuration
# =========================================
networks:
  carboncred-network:
    driver: bridge
    name: carboncred-network
