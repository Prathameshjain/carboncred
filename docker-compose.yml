# =========================================
# CarbonCred - Docker Compose Configuration
# =========================================
# Development setup with PostgreSQL database

version: '3.9'

services:
  # =========================================
  # PostgreSQL Database
  # =========================================
  db:
    image: postgres:16-alpine
    container_name: carboncred-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Postgre123}
      POSTGRES_DB: ${POSTGRES_DB:-carboncred}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - carboncred-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-carboncred}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================
  # Django Backend (Development)
  # =========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: carboncred-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Postgre123}
      - POSTGRES_DB=${POSTGRES_DB:-carboncred}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - carboncred-network
    profiles:
      - full

  # =========================================
  # React Frontend (Development)
  # =========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: carboncred-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - carboncred-network
    profiles:
      - full

  # =========================================
  # Redis Cache (Optional)
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: carboncred-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - carboncred-network
    profiles:
      - cache

# =========================================
# Persistent Volumes
# =========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# =========================================
# Network Configuration
# =========================================
networks:
  carboncred-network:
    driver: bridge
    name: carboncred-network
